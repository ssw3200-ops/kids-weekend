# 기관 홈페이지·예약 페이지에서 아이 행사를 모으는 목록
# 휴대폰에서 이 파일만 고쳐도 다음 실행부터 반영돼요.
#
# type
#   links : 페이지의 링크 글자 속 날짜로 행사를 찾음 (link_pattern 이 들어간 링크만)
#   table : 표(시설명·예약명·이용기간…) 한 줄 = 행사 1개
#   items : 목록 한 칸(li) = 행사 1개 (제목 + "기 간 2026-11-01 ~ 2026-11-15")
#   rss   : 블로그 RSS (제목·요약 속 날짜가 앞으로 있는 글만)
#
# kid: true  → 기관 자체가 아이·가족 대상 (키워드 없어도 통과)
# skip       → 제목에 들어가면 뺄 말
# enabled: false 로 끄기
# max_days: 기간이 이 날수보다 길면 상설로 보고 뺌 (기본 120)
#
# ※ 일부 기관(국립세종도서관 등)은 해외 접속을 막아서 GitHub(미국 서버)에서 안 열릴 수 있어요.
#   status.json 의 org 항목에서 기관별 결과를 확인하세요.

common_skip: [채용, 입찰, 점검, 심사, 결과, 선정, 공개구입, 자원봉사, 강사, 포럼, 토론회, 설명회,
              단체, 기관예약, 학급, 특수학급, 교사, 시니어, 어르신, 직원, 공무직, 공고]

