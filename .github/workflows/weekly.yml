name: 주말 행사 자동 수집

on:
  schedule:
    - cron: "7 12 * * 4"   # 매주 목요일 21:07 (한국시간)
  push:                     # 코드·설정·직접입력 행사 파일을 고치면 바로 다시 실행
    branches: [main]
    paths:
      - "src/**"
      - "config.yaml"
      - "manual_events.yaml"
  workflow_dispatch:        # 휴대폰에서 Actions 탭 → Run workflow 로 수동 실행
    inputs:
      sample:
        description: "샘플 데이터로 실행 (키 없이 테스트)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 수집 + 페이지 + 블로그 초안 생성
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if [ "${{ inputs.sample }}" = "true" ]; then
            python src/build.py --sample
          else
            python src/build.py
          fi

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "주말 행사 업데이트 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
