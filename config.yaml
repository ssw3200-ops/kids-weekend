# 이번 주말 아이랑 행사 — 설정 파일

site:
  title: "이번 주말 아이랑 어디 갈까?"
  blog_name: "아이랑 오늘 뭐하지?"
  blog_url: "https://blog.naver.com/todaywithkids"

# 공개 페이지는 전국(17개 시·도)을 모두 보여줍니다.
# 블로그 초안만 아래 지역 기준으로 만듭니다. (예: [서울, 경기] 로 바꾸면 수도권 글)
blog_regions: [세종, 대전]

# 주말 계산: 실행일 기준 다가오는 토·일 (금요일 저녁 행사도 포함하려면 include_friday: true)
weekend:
  include_friday: true

# 아이 행사 점수 (높을수록 위에 노출)
keywords:
  strong:   # +3점
    - 어린이
    - 키즈
    - 아동
    - 유아
    - 가족
    - 인형극
    - 동화
    - 체험
    - 그림책
    - 뮤지컬
    - 공룡
    - 과학
    - 놀이
    - 산타
    - 크리스마스
  weak:     # +1점
    - 축제
    - 전시
    - 박물관
    - 미술관
    - 공원
    - 빛
    - 마술
    - 서커스
    - 페스티벌
  exclude:  # 들어가면 제외
    - 성인
    - 19세
    - 청소년관람불가
    - 와인
    - 맥주
    - 주류
    - 취업
    - 채용
    - 세미나
    - 포럼
    - 학술

# 블로그 글에 넣을 최대 행사 수 (지역별로 나눠서)
max_events_in_post: 12
# 그중 공연(뮤지컬·연극·콘서트 등)은 최대 몇 개까지 — 체험·전시·시즌 행사를 먼저 넣음
max_shows_in_post: 3
