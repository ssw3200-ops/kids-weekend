<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>블로그 초안</title>
<style>
  body{margin:0;background:#F7F4EF;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#333}
  main{max-width:640px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:6px 0 14px}
  section{background:#fff;border-radius:16px;padding:14px;margin-bottom:14px}
  h2{font-size:16px;margin:0 0 10px}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:#FF6B8B;color:#fff;margin-top:8px;text-align:center;text-decoration:none}
  .btn.sub{background:#EFE7FF;color:#6C63FF}
  .ttl{display:flex;gap:8px;align-items:center;margin:6px 0}
  .ttl span{flex:1;font-size:14px;line-height:1.4}
  .ttl button{border:0;background:#FFF0F3;color:#FF6B8B;border-radius:10px;padding:8px 10px;font-weight:700}
  pre{white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.6;max-height:300px;overflow:auto;background:#FAFAFA;border-radius:10px;padding:10px;margin:0}
  .img{margin:10px 0}.img img{width:100%;border-radius:10px}.img div{font-size:13px;color:#777;margin-top:4px}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.2s}
  .toast.on{opacity:1}
</style>
</head>
<body>
<main>
  <h1 id="h">초안 불러오는 중…</h1>
  <section><h2>① 제목 고르기</h2><div id="titles"></div></section>
  <section><h2>② 본문 통째로 붙여넣기</h2><button class="btn" id="copyBody">본문 전체 복사</button><pre id="body" style="margin-top:10px"></pre></section>
  <section><h2>③ 사진 넣기</h2><a class="btn sub" id="zip" download>이미지 ZIP 받기</a><div id="imgs"></div></section>
</main>
<div class="toast" id="toast">복사했어요!</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(){$("toast").classList.add("on");setTimeout(()=>$("toast").classList.remove("on"),1200)}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}toast()}
(async()=>{
  const q=new URLSearchParams(location.search).get("week");
  const week=q||(await (await fetch("drafts/latest.json?"+Date.now())).json()).week;
  const base=`drafts/${week}/`;
  const j=await (await fetch(base+"draft.json?"+Date.now())).json();
  $("h").textContent=`${week} 주말 초안`;
  $("titles").innerHTML=j.titles.map((t,i)=>`<div class="ttl"><span>${esc(t)}</span><button data-i="${i}">복사</button></div>`).join("");
  $("titles").querySelectorAll("button").forEach(b=>b.onclick=()=>copy(j.titles[b.dataset.i]));
  $("body").textContent=j.body;$("copyBody").onclick=()=>copy(j.body);
  $("zip").href=base+encodeURIComponent(j.zip);
  $("imgs").innerHTML=j.images.map(m=>`<div class="img"><img src="${base+encodeURIComponent(m.file)}" loading="lazy"><div>📍 ${esc(m.file)} → ${esc(m.where)}</div></div>`).join("");
})().catch(()=>{$("h").textContent="아직 만들어진 초안이 없어요"});
</script>
</body>
</html>
