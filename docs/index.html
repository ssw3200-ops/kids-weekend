<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이번 주말 아이랑 어디 갈까? | 전국 아이랑 행사 모아보기</title>
<meta name="description" content="전국 17개 시·도의 아이랑 갈 만한 공연·전시·축제·체험을 지역·분야별로 골라 보세요. 매주 자동 업데이트.">
<meta property="og:title" content="이번 주말 아이랑 어디 갈까?">
<meta property="og:description" content="전국 아이랑 행사 모아보기 — 지역·분야·무료만 골라 보기 (매주 자동 업데이트)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FFF8EE;--card:#fff;--ink:#3d3a36;--sub:#8a8178;--pink:#FF6B8B;--line:#F1E6D8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
  header{padding:20px 16px 8px;text-align:center}
  h1{font-family:Jua,sans-serif;font-weight:400;font-size:27px;margin:0;line-height:1.3}
  h1 span:nth-child(7n+1){color:#FF5A5F}h1 span:nth-child(7n+2){color:#FF9F1C}h1 span:nth-child(7n+3){color:#F2B705}
  h1 span:nth-child(7n+4){color:#4CB84C}h1 span:nth-child(7n+5){color:#3FA7F5}h1 span:nth-child(7n+6){color:#6C63FF}h1 span:nth-child(7n){color:#C86DD7}
  .upd{font-size:12px;color:var(--sub);margin-top:6px}
  .filters{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 12px 6px}
  .top{display:flex;gap:8px;align-items:center}
  select,input[type=search]{font-size:16px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);padding:9px 10px;min-height:44px}
  select{font-family:Jua,sans-serif;flex:0 0 auto;max-width:42%}
  input[type=search]{flex:1;min-width:0}
  .seg{display:flex;background:#fff;border:2px solid var(--line);border-radius:14px;margin-top:8px;overflow:hidden}
  .seg button{flex:1;border:0;background:none;padding:9px 4px;font-family:Jua,sans-serif;font-size:15px;color:var(--sub);min-height:40px}
  .seg button.on{background:var(--pink);color:#fff}
  .row-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0 4px}
  .row-chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px;font-family:Jua,sans-serif;color:var(--ink);min-height:38px}
  .chip.on{background:#6C63FF;border-color:#6C63FF;color:#fff}
  .chip.opt.on{background:#2E9B45;border-color:#2E9B45}
  main{padding:10px 12px;max-width:640px;margin:0 auto}
  .count{font-size:14px;color:var(--sub);margin:4px 4px 10px;display:flex;justify-content:space-between}
  .card{background:var(--card);border-radius:20px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 0 var(--line);display:flex}
  .thumb{flex:0 0 108px;width:108px;min-height:150px;object-fit:cover;background:#f6efe6}
  .noimg{display:flex;align-items:center;justify-content:center;font-size:38px}
  .body{padding:12px 14px 14px;min-width:0;flex:1}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
  .tag{font-size:11.5px;padding:2px 8px;border-radius:999px;background:#F3EEFF;color:#6C63FF}
  .tag.news{background:#E8F0FF;color:#2F6FD6}
  .arts{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
  .arts a{display:block;font-size:12.5px;color:#2F6FD6;text-decoration:none;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .note{font-size:11.5px;color:var(--sub);margin-top:4px}
  .tag.free{background:#E3F8E6;color:#2E9B45}.tag.end{background:#FFE8E0;color:#E0603A}.tag.reg{background:#FFF1C9;color:#B07D00}
  .t{font-size:16.5px;font-weight:700;line-height:1.35;margin:0 0 6px;word-break:keep-all}
  .row{font-size:13.5px;color:#5b554f;margin:2px 0;line-height:1.45;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .go{display:inline-block;margin-top:8px;color:var(--pink);font-family:Jua,sans-serif;font-size:15px;text-decoration:none}
  .empty{text-align:center;color:var(--sub);padding:40px 0;line-height:1.7}
  .more[hidden]{display:none}
  .more{display:block;width:100%;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px;font-family:Jua,sans-serif;font-size:16px;color:var(--ink);margin:4px 0 16px}
  .sample{background:#FFF3B0;color:#7a6200;text-align:center;font-size:13px;padding:8px}
  footer{text-align:center;padding:20px 16px 40px;font-size:12.5px;color:var(--sub);line-height:1.7}
  footer a.blog{display:inline-block;margin-top:10px;background:#FFF0F3;color:var(--pink);font-family:Jua,sans-serif;font-size:17px;text-decoration:none;padding:12px 18px;border-radius:14px}
  .lock{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
  .lock[hidden]{display:none}
  .lock .box{background:#fff;border-radius:24px;padding:28px 22px;max-width:360px;width:100%;text-align:center;box-shadow:0 3px 0 var(--line)}
  .lock .emo{font-size:52px}
  .lock h2{font-family:Jua,sans-serif;font-weight:400;font-size:24px;margin:8px 0 6px;color:var(--pink)}
  .lock p{word-break:keep-all;font-size:14px;color:var(--sub);line-height:1.6;margin:0 0 16px}
  .lock input{width:100%;font-size:18px;text-align:center;border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  .lock button{width:100%;border:0;border-radius:14px;padding:14px;font-family:Jua,sans-serif;font-size:18px;background:var(--pink);color:#fff}
  .lock .err{color:#E0603A;font-size:13px;min-height:18px;margin-top:8px}
  .lock a{display:block;margin-top:14px;color:#6C63FF;font-size:14px}
</style>
</head>
<body>
<div class="lock" id="lock" hidden>
  <div class="box">
    <div class="emo">🔒🎈</div>
    <h2>아이랑 행사 모아보기</h2>
    <p>블로그 <b>아이랑 오늘 뭐하지?</b> 이웃님 전용 페이지예요.<br>비밀번호는 블로그 글에 댓글 남겨주시면<br>비밀댓글로 보내드려요 💌</p>
    <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" enterkeyhint="go">
    <button id="pwBtn">열기</button>
    <div class="err" id="pwErr"></div>
    <a id="lockBlog" href="https://blog.naver.com/todaywithkids">블로그로 가서 비밀번호 받기 →</a>
  </div>
</div>
<div id="sample" class="sample" hidden>지금은 샘플 데이터예요.</div>
<header>
  <h1 id="h1"></h1>
  <div class="upd" id="upd">불러오는 중…</div>
</header>
<div class="filters">
  <div class="top">
    <select id="region" aria-label="지역"></select>
    <select id="city" aria-label="시군구" hidden></select>
    <input type="search" id="q" placeholder="공연·장소 검색" aria-label="검색">
  </div>
  <div class="seg" id="period"></div>
  <div class="row-chips" id="cats"></div>
  <div class="row-chips" id="opts"></div>
</div>
<main>
  <div class="count"><span id="count"></span><span id="range"></span></div>
  <div id="list"></div>
  <button class="more" id="more" hidden>더 보기</button>
</main>
<footer>
  행사 정보는 공공데이터(한국관광공사·KOPIS·한국문화정보원)와 지역 뉴스 기사를 자동으로 모은 거예요.<br>
  일정·요금은 바뀔 수 있으니 출발 전에 꼭 공식 페이지를 확인하세요.<br>
  <a class="blog" id="blog" href="https://blog.naver.com/todaywithkids">🌈 세 아이 아빠 블로그에서 후기·꿀팁 보기</a>
</footer>
<script>
const WD="일월화수목금토", PAGE=30;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const d=s=>{const x=new Date(s+"T00:00:00");return `${x.getMonth()+1}/${x.getDate()}(${WD[x.getDay()]})`};
const EMO={"뮤지컬·연극":"🎭","인형극·아동극":"🧸","음악·콘서트":"🎻","무용·발레":"🩰","마술·서커스":"🎩","전시":"🖼️","체험·교육":"🧪","축제·행사":"🎉","기타":"🎈"};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const st={region:store.get("kw_region")||"전국",city:"",period:"this",cat:"",free:false,news:false,age:"",q:"",shown:PAGE};
let DATA=null;

function period(e){if(e.start===e.end)return d(e.start);
  const days=(new Date(e.end)-new Date(e.start))/864e5;return days>14?`~ ${d(e.end)}까지`:`${d(e.start)} ~ ${d(e.end)}`}
function range(){if(st.period==="this")return DATA.weekend;if(st.period==="next")return DATA.next_weekend;return [DATA.today,DATA.next_weekend[1]]}
const overlap=(e,[a,b])=>e.start<=b&&e.end>=a;

function title(t){$("h1").innerHTML=[...t].map(c=>c===" "?" ":`<span>${esc(c)}</span>`).join("")}

function setupRegion(){
  const counts={};DATA.events.forEach(e=>counts[e.region]=(counts[e.region]||0)+1);
  $("region").innerHTML=`<option value="전국">📍 전국</option>`+DATA.regions.map(r=>`<option value="${r}">📍 ${r}</option>`).join("");
  if(st.region!=="전국"&&!DATA.regions.includes(st.region))st.region="전국";
  $("region").value=st.region;
  $("region").onchange=()=>{st.region=$("region").value;st.city="";store.set("kw_region",st.region);setupCity();refresh()};
  setupCity();
}
function setupCity(){
  const cities=[...new Set(DATA.events.filter(e=>e.region===st.region&&e.city).map(e=>e.city))].sort();
  $("city").hidden=st.region==="전국"||cities.length<2;
  $("city").innerHTML=`<option value="">전체</option>`+cities.map(c=>`<option>${esc(c)}</option>`).join("");
  $("city").value=st.city;$("city").onchange=()=>{st.city=$("city").value;refresh()};
}
function setupPeriod(){
  const items=[["this","이번 주말"],["next","다음 주말"],["all","2주 전체"]];
  $("period").innerHTML=items.map(([k,v])=>`<button data-k="${k}" class="${st.period===k?"on":""}">${v}</button>`).join("");
  $("period").querySelectorAll("button").forEach(b=>b.onclick=()=>{st.period=b.dataset.k;setupPeriod();refresh()});
}
function setupChips(){
  $("cats").innerHTML=[["","전체"],...DATA.categories.map(c=>[c,`${EMO[c]||""} ${c}`])].map(([k,v])=>`<button class="chip${st.cat===k?" on":""}" data-k="${esc(k)}">${esc(v)}</button>`).join("");
  $("cats").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{st.cat=b.dataset.k;setupChips();refresh()});
  const opts=[["free","💸 무료만"],["news","📰 기사로 찾은 행사"],["유아 추천","👶 유아"],["초등 추천","🎒 초등"]];
  $("opts").innerHTML=opts.map(([k,v])=>{const on=k==="free"?st.free:k==="news"?st.news:st.age===k;return `<button class="chip opt${on?" on":""}" data-k="${k}">${v}</button>`}).join("");
  $("opts").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==="free")st.free=!st.free;else if(k==="news")st.news=!st.news;else st.age=st.age===k?"":k;setupChips();refresh()});
}
function filtered(){
  const r=range(),q=st.q.trim();
  return DATA.events.filter(e=>(st.region==="전국"||e.region===st.region)&&(!st.city||e.city===st.city)
    &&overlap(e,r)&&(!st.cat||e.category===st.cat)&&(!st.free||e.is_free)&&(!st.news||e.news)&&(!st.age||e.tags.includes(st.age))
    &&(!q||(e.title+" "+e.place+" "+e.address).includes(q)));
}
function card(e){
  const tags=[`<span class="tag reg">${esc(e.region)}${e.city?" "+esc(e.city):""}</span>`,
    ...e.tags.filter(t=>t.length<=12&&!isTime(t)).map(t=>t==="기사"?`<span class="tag news">📰 기사</span>`:`<span class="tag${t==="무료"?" free":t.includes("마감")?" end":""}">${esc(t)}</span>`)].join("");
  const em=EMO[e.category]||"🎈";
  const img=e.image?`<img class="thumb" loading="lazy" src="${esc(e.image)}" alt="" onerror="this.outerHTML='<div class=&quot;thumb noimg&quot;>${em}</div>'">`:`<div class="thumb noimg">${em}</div>`;
  return `<article class="card">${img}<div class="body"><div class="tags">${tags}</div>
    <h2 class="t">${esc(e.title)}</h2>
    <div class="row">📅 ${period(e)}</div>
    ${e.tags.filter(isTime).slice(0,1).map(t=>`<div class="row">⏰ ${esc(t)}</div>`).join("")}
    ${e.place||e.address?`<div class="row">📍 ${esc(e.place||e.address)}</div>`:""}
    <div class="row">💰 ${esc(e.price||(e.news?"요금은 기사·공식 페이지 확인":"요금은 상세페이지 확인"))}</div>
    ${e.age?`<div class="row">👶 ${esc(e.age)}</div>`:""}
    ${e.news?newsBlock(e):(e.link?`<a class="go" href="${esc(e.link)}" target="_blank" rel="noopener">자세히 · 예매 →</a>`:"")}
  </div></article>`;
}
const isTime=t=>/\d{1,2}\s*(시|:\d{2})/.test(t);
function newsBlock(e){
  const arts=(e.articles||[]).map(a=>`<a href="${esc(a.url)}" target="_blank" rel="noopener">📰 ${esc(a.source||"관련 기사")} · ${esc(a.title)}</a>`).join("");
  const off=e.official?`<a class="go" href="${esc(e.official)}" target="_blank" rel="noopener">공식 페이지 →</a>`:"";
  return `${off}<div class="arts">${arts}</div><div class="note">날짜·장소는 기사 기준이에요. 출발 전 꼭 확인해 주세요!</div>`;
}
function refresh(){st.shown=PAGE;render()}
function render(){
  const ev=filtered(),[a,b]=range();
  $("count").textContent=`${ev.length}개 행사`;$("range").textContent=`${d(a)} ~ ${d(b)}`;
  if(!ev.length){$("list").innerHTML=`<div class="empty">조건에 맞는 행사가 없어요 🥲<br>기간을 '2주 전체'로 바꾸거나 필터를 풀어 보세요.</div>`;$("more").hidden=true;return}
  $("list").innerHTML=ev.slice(0,st.shown).map(card).join("");
  $("more").hidden=ev.length<=st.shown;$("more").textContent=`더 보기 (${ev.length-st.shown}개 더)`;
}
$("more").onclick=()=>{st.shown+=PAGE;render()};
let qt;$("q").oninput=()=>{clearTimeout(qt);qt=setTimeout(()=>{st.q=$("q").value;refresh()},200)};

function start(j){
  DATA=j;title(j.site?.title||"이번 주말 아이랑 어디 갈까?");
  $("upd").textContent=`업데이트 ${j.updated} · 매주 목요일 자동 갱신`;
  if(j.sample)$("sample").hidden=false;
  if(j.site?.blog_url){$("blog").href=j.site.blog_url}
  setupRegion();setupPeriod();setupChips();render();
}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(enc,pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(enc.salt),iterations:enc.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(enc.iv)},key,b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function unlock(enc,pw,quiet){
  $("pwBtn").textContent="여는 중…";
  try{const j=await decrypt(enc,pw);store.set("kw_pw",pw);$("lock").hidden=true;start(j)}
  catch(e){$("lock").hidden=false;if(!quiet)$("pwErr").textContent="비밀번호가 맞지 않아요. 최신 비밀번호를 확인해 주세요!"}
  $("pwBtn").textContent="열기";
}
(async()=>{
  const r=await fetch("data.enc.json?"+Date.now());
  if(r.ok){
    const enc=await r.json();$("upd").textContent="";
    $("pwBtn").onclick=()=>unlock(enc,$("pw").value.trim());
    $("pw").onkeydown=e=>{if(e.key==="Enter")unlock(enc,$("pw").value.trim())};
    const saved=store.get("kw_pw");
    if(saved)await unlock(enc,saved,true);else $("lock").hidden=false;
    return;
  }
  const p=await fetch("data.json?"+Date.now());   // 샘플 모드
  if(!p.ok)throw 0;
  start(await p.json());
})().catch(()=>{$("upd").textContent="데이터를 불러오지 못했어요"});
</script>
</body>
</html>
