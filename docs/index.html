<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이번 주말 아이랑 어디 갈까?</title>
<meta name="description" content="세종·대전 이번 주말 아이랑 갈 만한 공연·전시·축제를 매주 자동으로 모아 보여드려요.">
<meta property="og:title" content="이번 주말 아이랑 어디 갈까?">
<meta property="og:description" content="세종·대전 주말 아이랑 행사 모아보기 (매주 자동 업데이트)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FFF8EE;--card:#fff;--ink:#3d3a36;--sub:#8a8178;--pink:#FF6B8B;--line:#F1E6D8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
  header{padding:22px 16px 10px;text-align:center}
  h1{font-family:Jua,sans-serif;font-weight:400;font-size:28px;margin:0;line-height:1.3}
  h1 span:nth-child(7n+1){color:#FF5A5F}h1 span:nth-child(7n+2){color:#FF9F1C}h1 span:nth-child(7n+3){color:#F2B705}
  h1 span:nth-child(7n+4){color:#4CB84C}h1 span:nth-child(7n+5){color:#3FA7F5}h1 span:nth-child(7n+6){color:#6C63FF}h1 span:nth-child(7n){color:#C86DD7}
  .when{display:inline-block;margin-top:8px;background:#FFE5EC;color:#E85D75;border-radius:20px;padding:5px 14px;font-family:Jua;font-size:16px}
  .upd{font-size:12px;color:var(--sub);margin-top:6px}
  .bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 12px 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
  .bar::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:15px;font-family:Jua;color:var(--ink);min-height:40px}
  .chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
  main{padding:12px;max-width:640px;margin:0 auto}
  .count{font-size:14px;color:var(--sub);margin:4px 4px 10px}
  .card{background:var(--card);border-radius:20px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 0 var(--line);display:flex;flex-direction:column}
  .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#f6efe6}
  .noimg{display:flex;align-items:center;justify-content:center;font-size:40px;aspect-ratio:16/5}
  .body{padding:14px 16px 16px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .tag{font-size:12px;padding:3px 9px;border-radius:999px;background:#F3EEFF;color:#6C63FF}
  .tag.free{background:#E3F8E6;color:#2E9B45}.tag.end{background:#FFE8E0;color:#E0603A}.tag.reg{background:#FFF1C9;color:#B07D00}
  .t{font-size:18px;font-weight:700;line-height:1.35;margin:0 0 8px;word-break:keep-all}
  .row{font-size:14px;color:#5b554f;margin:3px 0;line-height:1.45}
  .go{display:block;margin-top:12px;text-align:center;background:#FFF0F3;color:var(--pink);border-radius:14px;padding:12px;font-family:Jua;font-size:16px;text-decoration:none}
  .empty{text-align:center;color:var(--sub);padding:40px 0}
  .sample{background:#FFF3B0;color:#7a6200;text-align:center;font-size:13px;padding:8px}
  footer{text-align:center;padding:20px 16px 40px;font-size:13px;color:var(--sub);line-height:1.7}
  footer a{color:var(--pink);font-family:Jua;font-size:16px;text-decoration:none}
</style>
</head>
<body>
<div id="sample" class="sample" hidden>지금은 샘플 데이터예요. API 키를 등록하면 실제 행사로 바뀌어요.</div>
<header>
  <h1 id="h1"></h1>
  <div class="when" id="when">불러오는 중…</div>
  <div class="upd" id="upd"></div>
</header>
<nav class="bar" id="bar"></nav>
<main>
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>
<footer>
  행사 정보는 공공데이터(한국관광공사·KOPIS·한국문화정보원)를 자동으로 모은 거예요.<br>
  일정·요금은 바뀔 수 있으니 출발 전에 꼭 공식 페이지를 확인하세요.<br><br>
  <a id="blog" href="#">🌈 블로그에서 후기·꿀팁 보기</a>
</footer>
<script>
const WD="일월화수목금토";
const st={region:"전체",free:false,age:""};
let DATA=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const d=s=>{const x=new Date(s+"T00:00:00");return `${x.getMonth()+1}/${x.getDate()}(${WD[x.getDay()]})`};
function period(e){if(e.start===e.end)return d(e.start);
  const days=(new Date(e.end)-new Date(e.start))/864e5;return days>14?`~ ${d(e.end)}까지`:`${d(e.start)} ~ ${d(e.end)}`}
const EMO={"뮤지컬":"🎤","연극":"🎭","전시":"🖼️","축제":"🎉","체험":"🧪","아동":"🧸"};
const emo=e=>{for(const k in EMO)if((e.genre+e.title).includes(k))return EMO[k];return"🎈"};
function title(t){$("h1").innerHTML=[...t].map(c=>c===" "?" ":`<span>${esc(c)}</span>`).join("")}
function chips(){
  const items=[["region","전체"],...DATA.regions.map(r=>["region",r]),["free","무료만"],["age","유아 추천"],["age","초등 추천"]];
  $("bar").innerHTML=items.map(([k,v])=>{
    const on=k==="region"?st.region===v:k==="free"?st.free:st.age===v;
    return `<button class="chip${on?" on":""}" data-k="${k}" data-v="${esc(v)}">${esc(v)}</button>`}).join("");
  $("bar").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k,v=b.dataset.v;
    if(k==="region")st.region=v;else if(k==="free")st.free=!st.free;else st.age=st.age===v?"":v;
    chips();render()});
}
function render(){
  const ev=DATA.events.filter(e=>(st.region==="전체"||e.region===st.region)&&(!st.free||e.is_free)&&(!st.age||e.tags.includes(st.age)));
  $("count").textContent=`${ev.length}개 행사`;
  if(!ev.length){$("list").innerHTML=`<div class="empty">조건에 맞는 행사가 없어요 🥲<br>필터를 바꿔 보세요.</div>`;return}
  $("list").innerHTML=ev.map(e=>{
    const tags=[`<span class="tag reg">${esc(e.region)}</span>`,...e.tags.map(t=>`<span class="tag${t==="무료"?" free":t.includes("마감")?" end":""}">${esc(t)}</span>`)].join("");
    const img=e.image?`<img class="thumb" loading="lazy" src="${esc(e.image)}" alt="" onerror="this.outerHTML='<div class=&quot;thumb noimg&quot;>${emo(e)}</div>'">`:`<div class="thumb noimg">${emo(e)}</div>`;
    return `<article class="card">${img}<div class="body"><div class="tags">${tags}</div>
      <h2 class="t">${esc(e.title)}</h2>
      <div class="row">📅 ${period(e)}</div>
      ${e.place||e.address?`<div class="row">📍 ${esc(e.place||e.address)}</div>`:""}
      <div class="row">💰 ${esc(e.price||"요금은 상세페이지 확인")}</div>
      ${e.age?`<div class="row">👶 ${esc(e.age)}</div>`:""}
      ${e.link?`<a class="go" href="${esc(e.link)}" target="_blank" rel="noopener">자세히 보기 →</a>`:""}
    </div></article>`}).join("");
}
fetch("data.json?"+Date.now()).then(r=>r.json()).then(j=>{
  DATA=j;title(j.site?.title||"이번 주말 아이랑 어디 갈까?");
  const [a,b]=j.weekend;$("when").textContent=`${d(a)} ~ ${d(b)}`;
  $("upd").textContent=`업데이트 ${j.updated} · 매주 목요일 자동 갱신`;
  if(j.sample)$("sample").hidden=false;
  if(j.site?.blog_url)$("blog").href=j.site.blog_url;
  chips();render();
}).catch(()=>{$("when").textContent="데이터를 불러오지 못했어요"});
</script>
</body>
</html>
